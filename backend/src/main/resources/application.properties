spring.application.name=backend
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.datasource.url=jdbc:postgresql://localhost:5432/keylevelinsights
spring.datasource.username=keylevelinsights
spring.datasource.password=keylevelinsights
spring.security.oauth2.client.registration.blizzard.client-id=${BNET_CLIENT_ID}
spring.security.oauth2.client.registration.blizzard.client-secret=${BNET_CLIENT_SECRET}
spring.security.oauth2.client.registration.blizzard.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.blizzard.client-authentication-method=client_secret_basic
spring.security.oauth2.client.provider.blizzard.token-uri=https://oauth.battle.net/token
kli.dungeon.collection.cron=0 0 * * * *
kli.dungeon.collection.enabled-regions=EU,US,KR,TW
