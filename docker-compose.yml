services:
  db:
    image: postgres:16-alpine
    container_name: kli_db
    environment:
      POSTGRES_DB: keylevelinsights
      POSTGRES_USER: keylevelinsights
      POSTGRES_PASSWORD: keylevelinsights
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./backend/sql/001-initial-schema.sql:/docker-entrypoint-initdb.d/001-initial-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    networks:
      - app

  backend:
    container_name: kli_backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    env_file: ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: keylevelinsights
      DB_PASSWORD: keylevelinsights
      DB_NAME: keylevelinsights
      DB_SSL: "false"
      # Add your real API keys and secrets via env_file or overrides, not in source:
      # BNET_CLIENT_ID: ""
      # BNET_CLIENT_SECRET: ""
      # WCL_CLIENT_ID: ""
      # WCL_CLIENT_SECRET: ""
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/', { signal: AbortSignal.timeout(2000) }).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    ports:
      - "5000:5000" # Optional direct API access; frontend requests go through nginx
    networks:
      - app

  frontend:
    container_name: kli_frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_API_URL: /api
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "-T", "2", "http://127.0.0.1/"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    ports:
      - "8080:80"
    networks:
      - app

networks:
  app:

volumes:
  db_data:

