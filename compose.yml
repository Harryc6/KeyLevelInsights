services:
  postgres:
    image: postgres:latest
    container_name: kli-postgres
    environment:
      POSTGRES_DB: keylevelinsights
      POSTGRES_USER: keylevelinsights
      POSTGRES_PASSWORD: keylevelinsights
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
